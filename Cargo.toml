[package]
name = "sixdof"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
description = "Client for 6-degree-of-freedom input devices (SpaceMouse, SpaceNavigator, Spaceball) on Linux, macOS and Windows: spacenavd on Unix, the device's own USB HID reports elsewhere."
readme = "README.md"
repository = "https://github.com/gilbertorconde/sixdof"
homepage = "https://github.com/gilbertorconde/sixdof"
keywords = ["spacenavd", "spacemouse", "6dof", "hid", "cad"]
categories = ["hardware-support", "os::unix-apis", "os::windows-apis", "os::macos-apis"]

# The display-server backend is behind a feature, so docs.rs is told to build
# with it — otherwise half the crate would be missing from the docs.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The second backend: the Magellan protocol, spoken over a display-server
# connection by the vendor's own driver as well as by spacenavd.
magellan = ["dep:x11rb"]

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", optional = true }

# Where no daemon stands between the device and the application, its USB HID
# reports are read directly: Windows through the system's HID API (pure Rust),
# macOS through IOKit, opened shared so the vendor's driver keeps the device.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
