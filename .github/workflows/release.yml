name: Release

# A tag `vX.Y.Z` publishes the crate to crates.io, once the tag names the
# crate's own version and CI passes on Linux, macOS and Windows. Run by hand
# with a tag, it publishes that tag: how a release whose run stopped part-way
# is finished. A version already on crates.io is left alone.
#
# Authentication is crates.io trusted publishing: the job trades its GitHub
# OIDC token for a short-lived crates.io token, so no API token is stored in
# the repository. The crate must name this repository and this workflow file
# (release.yml) as a trusted publisher in its crates.io settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to publish, as vX.Y.Z"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag names the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${TAG#v}"
          echo "crate $version, tag $tag"
          test "$version" = "$tag" || { echo "tag $TAG does not match version $version"; exit 1; }

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    name: publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Already published?
        id: published
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -sf -o /dev/null -A "sixdof release (github.com/gilbertorconde/sixdof)" \
              "https://crates.io/api/v1/crates/sixdof/$version"; then
            echo "sixdof $version is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth

      - if: steps.published.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
