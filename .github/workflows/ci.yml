name: CI

on:
  # Tags are left to the release workflow, which runs this itself.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "What to check out"
        type: string
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features magellan -- -D warnings
      - run: cargo test
      - run: cargo clippy --all-targets --features magellan,hid -- -D warnings
      - run: cargo test --features magellan
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
